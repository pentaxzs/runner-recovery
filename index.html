<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>러닝 회복</title>
  <meta name="description" content="장경인대 회복 프로그램 트래커">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="러닝회복">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <div id="install-hint"></div>

    <div class="topbar">
      <div>
        <h1>러닝 회복</h1>
        <div class="sub" id="subtitle">장경인대 회복 프로그램</div>
      </div>
      <button class="btn btn-sm btn-ghost" id="settingsBtn" type="button">설정</button>
    </div>

    <nav class="tabbar">
      <button data-tab="today" type="button">오늘</button>
      <button data-tab="log" type="button">기록</button>
      <button data-tab="guide" type="button">가이드</button>
    </nav>

    <main>
      <section id="tab-today"></section>
      <section id="tab-log" class="hidden"></section>
      <section id="tab-guide" class="hidden"></section>
    </main>
  </div>
  <div id="modal-root"></div>
</body>
</html>
