<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>러닝 회복</title>
  <meta name="description" content="장경인대 회복 프로그램 트래커">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="RE:RUN">
  <meta name="theme-color" content="#006ffa">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="app">
    <div id="install-hint"></div>

    <div id="ptr"><span class="bar"><i></i></span><span id="ptrText">당겨서 새로고침</span></div>

    <div class="topbar">
      <div>
        <div class="title-row"><span id="headerGlyph"></span><h1>러닝 회복</h1></div>
        <div class="sub" id="subtitle">장경인대 회복 프로그램</div>
      </div>
      <button class="btn btn-sm btn-ghost" id="settingsBtn" type="button">설정</button>
    </div>

    <nav class="tabbar">
      <button data-tab="home" type="button">홈</button>
      <button data-tab="today" type="button">오늘</button>
      <button data-tab="log" type="button">기록</button>
      <button data-tab="guide" type="button">가이드</button>
    </nav>

    <main>
      <section id="tab-home" class="hidden"></section>
      <section id="tab-today"></section>
      <section id="tab-log" class="hidden"></section>
      <section id="tab-guide" class="hidden"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="cheer" class="cheer" role="status" aria-live="polite" hidden></div>
  <div id="runtimer" class="rt" hidden></div>
</body>
</html>
